<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeoGen User Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px; color: #333;
        }
        .container { 
            max-width: 1400px; margin: 0 auto; background: rgba(255, 255, 255, 0.95);
            border-radius: 20px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1); overflow: hidden;
        }
        .header { 
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white; padding: 30px; text-align: center;
        }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3); }
        .stats-section { background: #f8f9fa; padding: 30px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .stat-card { 
            background: white; border-radius: 15px; padding: 25px; text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1); transition: transform 0.3s ease;
        }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-number { font-size: 3em; font-weight: bold; color: #4CAF50; margin-bottom: 10px; }
        .stat-label { font-size: 1.1em; color: #666; text-transform: uppercase; letter-spacing: 1px; }
        .controls-section { padding: 30px; background: white; border-bottom: 1px solid #eee; }
        .controls-header { 
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; flex-wrap: wrap; gap: 15px;
        }
        .search-input { 
            width: 100%; max-width: 400px; padding: 12px 20px; border: 2px solid #ddd;
            border-radius: 25px; font-size: 16px; transition: border-color 0.3s ease;
        }
        .search-input:focus { outline: none; border-color: #4CAF50; box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1); }
        .btn { 
            padding: 12px 30px; border: none; border-radius: 25px; font-size: 16px;
            font-weight: bold; cursor: pointer; transition: all 0.3s ease; text-decoration: none;
            display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
        }
        .btn-primary { background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%); color: white; }
        .btn-secondary { background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%); color: white; }
        .btn-danger { background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%); color: white; }
        .btn-warning { background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%); color: white; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2); }
        .btn-small { padding: 8px 15px; font-size: 14px; border-radius: 15px; }
        .table-section { padding: 30px; background: white; }
        .table-wrapper { 
            overflow-x: auto; border-radius: 15px; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1); background: white;
        }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 15px 20px; text-align: left; border-bottom: 1px solid #eee; font-size: 16px; }
        th { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;
        }
        tbody tr:hover { background: #f8f9fa; }
        tbody td { font-size: 16px; font-weight: 500; }
        .status-badge { 
            padding: 6px 12px; border-radius: 20px; font-size: 14px;
            font-weight: bold; text-transform: uppercase; display: inline-block;
        }
        .status-active { background: #d4edda; color: #155724; }
        .status-inactive { background: #f8d7da; color: #721c24; }
        .row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .modal { 
            display: none; position: fixed; z-index: 1000; left: 0; top: 0;
            width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.6);
        }
        .modal.show { display: flex; align-items: center; justify-content: center; }
        .modal-content { 
            background-color: white; padding: 0; border-radius: 20px; width: 90%;
            max-width: 500px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        .modal-header { 
            padding: 30px 30px 20px; border-bottom: 1px solid #eee;
            display: flex; justify-content: space-between; align-items: center;
        }
        .modal-title { font-size: 1.5em; font-weight: bold; color: #333; }
        .modal-close { 
            background: none; border: none; font-size: 28px; cursor: pointer;
            color: #999; width: 30px; height: 30px; border-radius: 50%;
        }
        .modal-close:hover { background: #f5f5f5; color: #333; }
        .modal-body { padding: 30px; }
        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        .form-group input, .form-group select { 
            width: 100%; padding: 12px 15px; border: 2px solid #ddd; border-radius: 10px;
            font-size: 16px; transition: border-color 0.3s ease; font-family: inherit;
        }
        .form-group input:focus, .form-group select:focus { 
            outline: none; border-color: #4CAF50; box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
        }
        .modal-footer { padding: 20px 30px 30px; display: flex; gap: 15px; justify-content: flex-end; }
        .loading { text-align: center; padding: 50px; font-size: 1.5em; color: #666; }
        .notification { 
            position: fixed; top: 20px; right: 20px; padding: 15px 25px; border-radius: 10px;
            font-weight: bold; z-index: 2000; max-width: 400px; animation: slideIn 0.3s ease;
        }
        .notification.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .notification.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @media (max-width: 768px) { 
            body { padding: 10px; }
            .controls-header { flex-direction: column; align-items: stretch; }
            .search-input { max-width: none; }
            .row-actions { flex-direction: column; gap: 5px; }
            .modal-footer { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎭 VeoGen User Manager</h1>
            <p>Manage your VeoGen platform users with ease</p>
        </div>
        <div class="stats-section">
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-number" id="totalUsers">-</div><div class="stat-label">Total Users</div></div>
                <div class="stat-card"><div class="stat-number" id="activeUsers">-</div><div class="stat-label">Active Users</div></div>
                <div class="stat-card"><div class="stat-number" id="totalVideos">-</div><div class="stat-label">Total Videos</div></div>
                <div class="stat-card"><div class="stat-number" id="totalApiKeys">-</div><div class="stat-label">API Keys</div></div>
            </div>
        </div>
        <div class="controls-section">
            <div class="controls-header">
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search users...">
                <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                    <button class="btn btn-primary" onclick="openCreateModal()">➕ Add User</button>
                    <button class="btn btn-secondary" onclick="refreshData()">🔄 Refresh</button>
                    <button class="btn btn-warning" onclick="exportUsers()">📊 Export</button>
                </div>
            </div>
        </div>
        <div class="table-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>User Management</h2>
                <span id="userCount" style="color: #666;">Loading...</span>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr><th>ID</th><th>Email</th><th>Username</th><th>Full Name</th><th>Status</th><th>Videos</th><th>API Keys</th><th>Created</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr><td colspan="9" class="loading">Loading users...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div id="userModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Add New User</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="userForm" onsubmit="submitUser(event)">
                    <div class="form-group">
                        <label for="modalEmail">Email Address *</label>
                        <input type="email" id="modalEmail" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="modalUsername">Username *</label>
                        <input type="text" id="modalUsername" name="username" required>
                    </div>
                    <div class="form-group" id="passwordGroup">
                        <label for="modalPassword">Password *</label>
                        <input type="password" id="modalPassword" name="password" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="modalFullName">Full Name</label>
                        <input type="text" id="modalFullName" name="full_name">
                    </div>
                    <div class="form-group">
                        <label for="modalIsActive">Status</label>
                        <select id="modalIsActive" name="is_active">
                            <option value="true">Active</option>
                            <option value="false">Inactive</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button type="submit" form="userForm" class="btn btn-primary" id="submitBtn">💾 Create User</button>
            </div>
        </div>
    </div>
    <script>
        let users = [], filteredUsers = [], editingUserId = null;
        const API_BASE = '/api';
        
        document.addEventListener('DOMContentLoaded', () => { console.log('🚀 Starting...'); initializeApp(); });
        
        async function initializeApp() {
            try {
                await Promise.all([loadUsers(), loadStats()]);
                setupEventListeners();
                console.log('✅ Initialized successfully');
            } catch (error) {
                console.error('❌ Failed to initialize:', error);
                showNotification('Failed to initialize: ' + error.message, 'error');
            }
        }
        
        function setupEventListeners() {
            document.getElementById('searchInput').addEventListener('input', e => filterUsers(e.target.value));
            document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
            document.getElementById('userModal').addEventListener('click', e => { if (e.target.id === 'userModal') closeModal(); });
        }
        
        async function apiRequest(endpoint, options = {}) {
            try {
                const response = await fetch(API_BASE + endpoint, {
                    headers: { 'Content-Type': 'application/json', ...options.headers },
                    ...options
                });
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.detail || `HTTP ${response.status}`);
                }
                return await response.json();
            } catch (error) {
                console.error('API Request failed:', error);
                throw error;
            }
        }
        
        async function loadUsers() {
            try {
                users = await apiRequest('/users');
                filteredUsers = [...users];
                renderUsers();
                updateUserCount();
                console.log(`✅ Loaded ${users.length} users`);
            } catch (error) {
                showNotification('Failed to load users: ' + error.message, 'error');
                document.getElementById('usersTableBody').innerHTML = '<tr><td colspan="9" style="text-align: center; padding: 50px;">❌ Failed to load</td></tr>';
            }
        }
        
        async function loadStats() {
            try {
                const stats = await apiRequest('/stats');
                document.getElementById('totalUsers').textContent = stats.total_users || 0;
                document.getElementById('activeUsers').textContent = stats.active_users || 0;
                document.getElementById('totalVideos').textContent = stats.total_videos || 0;
                document.getElementById('totalApiKeys').textContent = stats.total_api_keys || 0;
            } catch (error) {
                showNotification('Failed to load statistics: ' + error.message, 'error');
            }
        }
        
        function renderUsers() {
            const tbody = document.getElementById('usersTableBody');
            if (filteredUsers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" style="text-align: center; padding: 50px;">No users found</td></tr>';
                return;
            }
            tbody.innerHTML = filteredUsers.map(user => `
                <tr>
                    <td>${user.id}</td>
                    <td>${user.email}</td>
                    <td>${user.username}</td>
                    <td>${user.full_name || '-'}</td>
                    <td><span class="status-badge ${user.is_active ? 'status-active' : 'status-inactive'}">${user.is_active ? 'Active' : 'Inactive'}</span></td>
                    <td>${user.video_count || 0}</td>
                    <td>${user.api_usage || 0}</td>
                    <td>${formatDateTime(user.created_at)}</td>
                    <td>
                        <div class="row-actions">
                            <button class="btn btn-secondary btn-small" onclick="openEditModal('${user.id}')">✏️</button>
                            <button class="btn btn-warning btn-small" onclick="toggleUserStatus('${user.id}')">${user.is_active ? '⏸️' : '▶️'}</button>
                            <button class="btn btn-danger btn-small" onclick="deleteUser('${user.id}', '${user.username}')">🗑️</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }
        
        function filterUsers(searchTerm) {
            if (!searchTerm.trim()) {
                filteredUsers = [...users];
            } else {
                const term = searchTerm.toLowerCase();
                filteredUsers = users.filter(user => 
                    user.email.toLowerCase().includes(term) ||
                    user.username.toLowerCase().includes(term) ||
                    (user.full_name && user.full_name.toLowerCase().includes(term))
                );
            }
            renderUsers();
            updateUserCount();
        }
        
        function updateUserCount() {
            const countEl = document.getElementById('userCount');
            countEl.textContent = filteredUsers.length === users.length ? 
                `${users.length} users total` : `${filteredUsers.length} of ${users.length} users`;
        }
        
        function openCreateModal() {
            editingUserId = null;
            document.getElementById('modalTitle').textContent = 'Add New User';
            document.getElementById('submitBtn').textContent = '💾 Create User';
            document.getElementById('passwordGroup').style.display = 'block';
            document.getElementById('userForm').reset();
            document.getElementById('modalIsActive').value = 'true';
            showModal();
        }
        
        function openEditModal(userId) {
            const user = users.find(u => u.id === userId);
            if (!user) return showNotification('User not found', 'error');
            editingUserId = userId;
            document.getElementById('modalTitle').textContent = 'Edit User';
            document.getElementById('submitBtn').textContent = '💾 Update User';
            document.getElementById('passwordGroup').style.display = 'none';
            document.getElementById('modalEmail').value = user.email;
            document.getElementById('modalUsername').value = user.username;
            document.getElementById('modalFullName').value = user.full_name || '';
            document.getElementById('modalIsActive').value = user.is_active.toString();
            showModal();
        }
        
        function showModal() {
            document.getElementById('userModal').classList.add('show');
            document.body.style.overflow = 'hidden';
        }
        
        function closeModal() {
            document.getElementById('userModal').classList.remove('show');
            document.body.style.overflow = '';
        }
        
        async function submitUser(event) {
            event.preventDefault();
            const formData = new FormData(event.target);
            const userData = {
                email: formData.get('email'),
                username: formData.get('username'),
                full_name: formData.get('full_name') || null,
                is_active: formData.get('is_active') === 'true'
            };
            if (!editingUserId) userData.password = formData.get('password');
            
            try {
                if (editingUserId) {
                    await apiRequest(`/users/${editingUserId}`, { method: 'PUT', body: JSON.stringify(userData) });
                    showNotification('User updated successfully', 'success');
                } else {
                    await apiRequest('/users', { method: 'POST', body: JSON.stringify(userData) });
                    showNotification('User created successfully', 'success');
                }
                closeModal();
                await loadUsers();
                await loadStats();
            } catch (error) {
                showNotification('Failed to save user: ' + error.message, 'error');
            }
        }
        
        async function toggleUserStatus(userId) {
            try {
                await apiRequest(`/users/${userId}/status`, { method: 'PATCH' });
                showNotification('User status updated', 'success');
                await loadUsers();
                await loadStats();
            } catch (error) {
                showNotification('Failed to update status: ' + error.message, 'error');
            }
        }
        
        async function deleteUser(userId, username) {
            if (!confirm(`⚠️ Delete user "${username}"? This cannot be undone.`)) return;
            try {
                await apiRequest(`/users/${userId}`, { method: 'DELETE' });
                showNotification('User deleted successfully', 'success');
                await loadUsers();
                await loadStats();
            } catch (error) {
                showNotification('Failed to delete user: ' + error.message, 'error');
            }
        }
        
        async function refreshData() {
            showNotification('Refreshing...', 'success');
            await Promise.all([loadUsers(), loadStats()]);
        }
        
        async function exportUsers() {
            try {
                const headers = ['ID', 'Email', 'Username', 'Full Name', 'Status', 'Videos', 'API Keys', 'Created'];
                const rows = users.map(user => [
                    user.id, user.email, user.username, user.full_name || '',
                    user.is_active ? 'Active' : 'Inactive', user.video_count || 0,
                    user.api_usage || 0, new Date(user.created_at).toLocaleDateString()
                ]);
                const csvContent = [headers, ...rows].map(row => row.map(field => `"${field}"`).join(',')).join('\n');
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                const url = URL.createObjectURL(blob);
                link.setAttribute('href', url);
                link.setAttribute('download', 'veogen-users.csv');
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showNotification('Users exported successfully', 'success');
            } catch (error) {
                showNotification('Failed to export users', 'error');
            }
        }
        
        function formatDateTime(dateString) {
            try {
                const date = new Date(dateString);
                return date.toLocaleDateString() + '<br>' + date.toLocaleTimeString();
            } catch (e) {
                return dateString;
            }
        }
        
        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);
            setTimeout(() => {
                if (notification.parentNode) notification.parentNode.removeChild(notification);
            }, 5000);
        }
    </script>
</body>
</html>
