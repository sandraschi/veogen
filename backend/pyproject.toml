[project]
name = "veogen-backend"
version = "3.1.0"
description = "VeoGen Industrial - AI media generation hub backend (Phase 2 salvage)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.2.1",
    "google-genai>=0.5.2",
    "google-generativeai>=0.8.0",
    "google-cloud-aiplatform>=1.47.0",
    "fastmcp>=3.4.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.1",
    "aiofiles>=23.2.1",
    "pillow>=10.2.0",
    "opencv-python>=4.9.0.0",
    "numpy>=1.26.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "sqlalchemy>=2.0.28",
    "httpx>=0.27.0",
    "tenacity>=8.2.3",
    "jinja2>=3.1.3",
    "prometheus-client>=0.19.0",
    "psutil>=5.9.8",
    "PyJWT>=2.8.0",
    "email-validator>=2.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
# Correctness-focused baseline for the salvaged codebase. The full
# UP/DTZ/BLE modernization suite would rewrite 1000+ lines of legacy code;
# enforce the lints that catch real bugs (F) + common quality rules.
lint.select = ["E4", "E7", "E9", "F", "I"]
lint.per-file-ignores = { "app/database.py" = ["E402"] }

[dependency-groups]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.0.0",
]
