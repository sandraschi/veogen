server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 🎯 VeoGen Backend Container ONLY - WITH SMART FILTERING
  - job_name: veogen-docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: veogen-docker
          __path__: /var/lib/docker/containers/1056452549ea*/*log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs: attrs
      - json:
          expressions:
            tag: attrs.tag
          source: attrs
      - regex:
          expression: (?P<container_name>(?:[^|]*))\|
          source: tag
      - timestamp:
          format: RFC3339Nano
          source: time
      
      # 🚀 AUSTRIAN EFFICIENCY FILTERING - DROP USELESS NOISE
      - drop:
          expression: '.*GET /health.*'  # DROP health checks
      - drop:
          expression: '.*GET /metrics.*'  # DROP metrics polling  
      - drop:
          expression: '.*"level":\s*"INFO".*uvicorn\.access.*'  # DROP uvicorn access INFO
      - drop:
          expression: '.*200 OK.*'  # DROP successful HTTP responses
      - drop:
          expression: '.*HTTP/1\.1" 200.*'  # DROP 200 status logs
      
      - labels:
          stream:
          container_name:
      - output:
          source: output

  # 🎯 VeoGen Application Logs - CRITICAL EVENTS ONLY
  - job_name: veogen-backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: veogen-backend
          service: backend
          __path__: /app/logs/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            logger: logger
            message: message
            service: service
      
      # 🚨 CRITICAL FILTERING - ONLY IMPORTANT STUFF
      - drop:
          expression: '.*"level":\s*"INFO".*'  # DROP all INFO logs
      - drop:
          expression: '.*GET /health.*'  # DROP health endpoints
      - drop:
          expression: '.*GET /metrics.*'  # DROP metrics endpoints
      - drop:
          expression: '.*uvicorn\.access.*'  # DROP access logs entirely
      - drop:
          expression: '.*200.*'  # DROP successful responses
      
      # ✅ KEEP ONLY: WARN, ERROR, CRITICAL, EXCEPTIONS
      - match:
          selector: '{level=~"WARN|ERROR|CRITICAL|EXCEPTION"}'
          stages:
            - timestamp:
                format: RFC3339
                source: timestamp
            - labels:
                level:
                logger:
                service:

  # 🚨 ERROR LOGS - ALWAYS KEEP (HIGH PRIORITY)
  - job_name: error-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: error-logs
          severity: error
          __path__: /app/logs/error_*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            service: service
            error_type: error_type
            stack_trace: stack_trace
      - timestamp:
          format: RFC3339
          source: timestamp
      - labels:
          level:
          service:
          error_type:

  # 🎬 VIDEO GENERATION - BUSINESS LOGIC ONLY
  - job_name: veogen-video-generation
    static_configs:
      - targets:
          - localhost
        labels:
          job: veogen-video-generation
          service: video-generation
          __path__: /app/logs/video_*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            job_id: job_id
            status: status
            duration: duration
            error: error
      
      # 📹 FILTER: Only significant video events
      - drop:
          expression: '.*"level":\s*"INFO".*'  # DROP INFO noise
      - drop:
          expression: '.*processing.*frame.*'  # DROP per-frame logs
      - drop:
          expression: '.*heartbeat.*'  # DROP heartbeat logs
      
      # ✅ KEEP: Start, Complete, Error, Progress milestones
      - match:
          selector: '{status=~"started|completed|error|progress_milestone"}'
          stages:
            - timestamp:
                format: RFC3339
                source: timestamp
            - labels:
                level:
                job_id:
                status:

# 🎯 FILTERING SUMMARY:
# ❌ DROPPED: Health checks, metrics polling, 200 responses, INFO logs
# ❌ DROPPED: Access logs, heartbeats, per-frame processing
# ❌ DROPPED: Routine status updates, normal operations
# ✅ KEPT: Errors, warnings, critical events, business milestones
# ✅ KEPT: Application failures, exceptions, user actions