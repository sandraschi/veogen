# Temporary override to run veogen without unified-monitoring network
# Use this if the unified-monitoring network doesn't exist yet
# Usage: docker compose -f docker-compose.yml -f docker-compose.no-monitoring.yml up -d

services:
  backend:
    networks:
      - veogen-network
      # unified-monitoring removed temporarily

  frontend:
    networks:
      - veogen-network
      # unified-monitoring removed temporarily

  postgres:
    networks:
      - veogen-network
      # unified-monitoring removed temporarily

  redis:
    networks:
      - veogen-network
      # unified-monitoring removed temporarily

  livekit:
    networks:
      - veogen-network
      # unified-monitoring removed temporarily

  nginx:
    networks:
      - veogen-network
      # unified-monitoring removed temporarily

