services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4700:8000"  # Backend API
      - "4705:8001"  # Metrics port
    environment:
      - DEBUG=false
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql+asyncpg://veogen:veogen123@postgres:5432/veogen
      - EMAIL_SMTP=smtp-mail.outlook.com
      - EMAIL_PORT=25
      - EMAIL_USER=sandraschipal@hotmail.com
      - EMAIL_PASS=vlkaragatumrxsgt
      - EMAIL_FROM=sandraschipal@hotmail.com
      - EMAIL_DEV_OUTBOX=dev_emails/
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/outputs:/app/outputs
      - ./backend/temp:/app/temp
      - ./backend/logs:/app/logs
      - ./backend/dev_emails:/app/dev_emails
      - google_credentials:/app/credentials
    depends_on:
      - postgres
      - redis
    networks:
      - veogen-network
      - unified-monitoring
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=veogen-backend"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "promtail.enabled=true"
      - "promtail.job=veogen-backend"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4710:3000"  # Frontend
    environment:
      - REACT_APP_API_URL=http://localhost:4700
      - REACT_APP_VERSION=1.0.0
      - REACT_APP_GRAFANA_URL=http://localhost:3000
    depends_on:
      - backend
    networks:
      - veogen-network
      - unified-monitoring
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=veogen-frontend"
    labels:
      - "promtail.enabled=true"
      - "promtail.job=veogen-frontend"

  postgres:
    image: postgres:15-alpine
    ports:
      - "4715:5432"  # PostgreSQL
    environment:
      - POSTGRES_DB=veogen
      - POSTGRES_USER=veogen
      - POSTGRES_PASSWORD=veogen123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - veogen-network
      - unified-monitoring
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=postgres"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veogen -d veogen"]
      interval: 30s
      timeout: 5s
      retries: 5
    labels:
      - "promtail.enabled=true"
      - "promtail.job=postgres"

  redis:
    image: redis:7-alpine
    ports:
      - "4712:6379"  # Redis
    volumes:
      - redis_data:/data
    networks:
      - veogen-network
      - unified-monitoring
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=redis"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s

  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"  # WebSocket & HTTP
      - "7881:7881"  # WebRTC
      - "7882:7882/udp"  # TURN/UDP
      - "3478:3478/udp"  # STUN/UDP
    environment:
      - LIVEKIT_KEYS_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_KEYS_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_KEYS_REDIS_ADDR=redis:6379
      - LIVEKIT_TURN_STATIC_CREDS=${LIVEKIT_TURN_CREDS}
    depends_on:
      - redis
    networks:
      - veogen-network
      - unified-monitoring
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=livekit"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7880/rtc/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    labels:
      - "promtail.enabled=true"
      - "promtail.job=livekit"
      - "promtail.job=redis"

  nginx:
    image: nginx:alpine
    ports:
      - "4760:80"   # Nginx HTTP
      - "4765:443"  # Nginx HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - static_files:/var/www/static
    depends_on:
      - frontend
      - backend
    networks:
      - veogen-network
      - unified-monitoring
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=nginx"
    labels:
      - "promtail.enabled=true"
      - "promtail.job=nginx"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  google_credentials:
    driver: local
  static_files:
    driver: local

networks:
  veogen-network:
    driver: bridge
  unified-monitoring:
    external: true
    name: configs_unified-monitoring
